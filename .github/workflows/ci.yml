name: Herbie CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Herbie
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make libxml2-utils
          git clone https://github.com/flooooooooooow/flow.git .flow-toolchain
          git -C .flow-toolchain checkout --detach 7687fc936365e17bc6286415585c55fcc6ea64c3
          echo "$PWD/.flow-toolchain" >> "$GITHUB_PATH"
          export PATH="$PWD/.flow-toolchain:$PATH"
          flow version
      - name: Check engineering regression values
        run: flow run tests/engineering_smoke.flow
      - name: Check conservative quarter-car energy
        run: flow run tests/vehicle_energy.flow
      - name: Check truss element and correlated tolerance models
        run: flow run tests/truss_uncertainty.flow
      - name: Check electrical mechanics and DC motor physics
        run: flow run tests/electromechanics.flow
      - name: Check engine map and battery physics
        run: flow run tests/engine_battery.flow
      - name: Check DC nodal circuit solver
        run: flow run tests/circuit_network.flow
      - name: Run electric-drive demonstration
        run: flow run examples/electric_drive_demo.flow
      - name: Run mapped-engine demonstration
        run: flow run examples/engine_dyno_demo.flow
      - name: Verify composed Flow full-car assembly
        run: flow run tests/full_car.flow
      - name: Run composed Flow car example
        run: flow run examples/full_car_demo.flow
      - name: Verify native Flow equation-first RK4 vehicle model
        run: flow run examples/equation_vehicle.flow
      - name: Verify correlated linear dimensional stacks
        run: flow run tests/linear_stackups.flow
      - name: Run dimensional stack demonstration
        run: flow run examples/linear_stackups_demo.flow
      - name: Verify DC modified nodal analysis voltage-source regressions
        run: flow run tests/mna_voltage_sources.flow
      - name: Verify linear circuit transients
        run: flow run tests/circuit_transient.flow
      - name: Verify AC phasor MNA analytical fixtures
        run: flow run tests/ac_phasor_mna.flow
      - name: Verify sparse DC MNA assembly against dense reference
        run: flow run tests/sparse_mna.flow
      - name: Benchmark sparse 40-node ladder vs dense MNA
        run: flow run tests/sparse_bench.flow
      - name: Verify nonlinear diode NR and switch events
        run: flow run tests/nl_devices.flow
      - name: Verify versioned netlist parse, export and solver stamps
        run: flow run tests/netlist.flow
      - name: Verify FMI 2.0 modelDescription rules, round trip and export
        run: flow run tests/fmi2_model_description.flow
      - name: Validate FMI 2.0 rewrites and exports against the FMI 2.0.4 XSD
        run: xmllint --noout --schema tests/fmi2/schema/fmi2ModelDescription.xsd /tmp/herbie-fmi2-*.xml
      - name: Cross-validate circuits against stored ngspice-42 references
        run: flow run tests/ngspice_crossval.flow
      - name: Cross-validate bridge, rectifier and RLC ngspice fixtures
        run: flow run tests/ngspice_fixtures.flow
      - name: Verify index-1 DAE MNA transient companions
        run: flow run tests/dae_mna.flow
      - name: Verify zero-Ron ideal switch MNA
        run: flow run tests/ideal_switch.flow
      - name: Run ideal voltage source circuit demonstration
        run: flow run examples/mna_voltage_sources_demo.flow
      - name: Run AC phasor circuit demonstration
        run: flow run examples/ac_phasor_demo.flow
      - name: Run sparse MNA demonstration
        run: flow run examples/sparse_mna_demo.flow
      - name: Run sparse ladder timing demonstration
        run: flow run examples/sparse_bench_demo.flow
      - name: Run nonlinear devices demonstration
        run: flow run examples/nl_devices_demo.flow
      - name: Run netlist import demonstration
        run: flow run examples/netlist_demo.flow
      - name: Run DAE MNA transient demonstration
        run: flow run examples/dae_mna_demo.flow
      - name: Run ideal switch demonstration
        run: flow run examples/ideal_switch_demo.flow
      - name: Verify first-class Flow physical units
        run: flow run examples/suspension_units.flow
      - name: Verify shared ODE integrators, events and multirate schedule
        run: flow run tests/ode_platform.flow
      - name: Run ODE platform demonstration
        run: flow run examples/ode_platform_demo.flow
      - name: Verify scenario CSV error budgets and readiness labels
        run: flow run tests/verification_matrix.flow
      - name: Run verification matrix demonstration
        run: flow run examples/verification_matrix_demo.flow
      - name: Verify seeded Monte Carlo stacks, Pp/Ppk and SPC limits
        run: flow run tests/montecarlo_stack.flow
      - name: Run Monte Carlo stack demonstration
        run: flow run examples/montecarlo_stack_demo.flow
      - name: Verify 2D truss FEM assembly, CG and reactions
        run: flow run tests/fem_truss.flow
      - name: Run FEM truss demonstration
        run: flow run examples/fem_truss_demo.flow
      - name: Verify native seven-DOF full-car ride vs JS parity
        run: flow run tests/fullcar_ride.flow
      - name: Run native full-car ride demonstration
        run: flow run examples/fullcar_ride_demo.flow
      - name: Verify driveline pendulum, shaft, differential and clutch
        run: flow run tests/driveline.flow
      - name: Run driveline demonstration
        run: flow run examples/driveline_demo.flow
      - name: Verify mean-value engine maps, manifold and AFR
        run: flow run tests/meanvalue_engine.flow
      - name: Run mean-value engine demonstration
        run: flow run examples/meanvalue_engine_demo.flow
      - name: Verify battery pack topology, limits, heat and SOH
        run: flow run tests/battery_pack.flow
      - name: Run battery pack demonstration
        run: flow run examples/battery_pack_demo.flow
      - name: Verify Clarke/Park, PMSM dq, averaged inverter and FOC
        run: flow run tests/electric_drive.flow
      - name: Run PMSM FOC demonstration
        run: flow run examples/pmsm_foc_demo.flow
      - name: Verify thermo-fluid pipe, orifice, NTU and cooling loop
        run: flow run tests/thermo_fluid.flow
      - name: Run closed cooling loop demonstration
        run: flow run examples/cooling_loop_demo.flow
      - name: Verify calibration split, MAD, affine fit and holdout
        run: flow run tests/calibration_pipeline.flow
      - name: Run calibration demonstration
        run: flow run examples/calibration_demo.flow
      - name: Verify block-graph schedule, loops, rates and round-trip
        run: flow run tests/block_graph.flow
      - name: Run block-graph demonstration
        run: flow run examples/block_graph_demo.flow
      - name: Run vehicle demo
        run: flow run examples/quarter_car_demo.flow
      - name: Run manufacturing demo
        run: flow run examples/manufacturing_demo.flow

  browser-vehicle-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript and regression tests
        run: |
          node --check site/model.js
          node --check site/app.js
          node --check site/car3d.js
          node --check site/fullcar.js
          node --test tests/vehicle_lab.test.mjs
          node --test tests/fullcar_browser.test.mjs
          node --test tests/site_contract.test.mjs

  visual-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify styled Three.js WebGL simulation in Chromium
        run: node tests/pages_visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herbie-vehicle-lab-screenshots
          path: vehicle-lab-*.png
          if-no-files-found: ignore
