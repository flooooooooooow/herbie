name: Herbie CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Herbie
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make
          git clone https://github.com/flooooooooooow/flow.git .flow-toolchain
          git -C .flow-toolchain checkout --detach 7687fc936365e17bc6286415585c55fcc6ea64c3
          ./.flow-toolchain/flow version
      - name: Check engineering regression values
        run: ./.flow-toolchain/flow run tests/engineering_smoke.flow
      - name: Check conservative quarter-car energy
        run: ./.flow-toolchain/flow run tests/vehicle_energy.flow
      - name: Check truss element and correlated tolerance models
        run: ./.flow-toolchain/flow run tests/truss_uncertainty.flow
      - name: Check electrical mechanics and DC motor physics
        run: ./.flow-toolchain/flow run tests/electromechanics.flow
      - name: Check engine map and battery physics
        run: ./.flow-toolchain/flow run tests/engine_battery.flow
      - name: Check DC nodal circuit solver
        run: ./.flow-toolchain/flow run tests/circuit_network.flow
      - name: Run electric-drive demonstration
        run: ./.flow-toolchain/flow run examples/electric_drive_demo.flow
      - name: Run mapped-engine demonstration
        run: ./.flow-toolchain/flow run examples/engine_dyno_demo.flow
      - name: Verify composed Flow full-car assembly
        run: ./.flow-toolchain/flow run tests/full_car.flow
      - name: Run composed Flow car example
        run: ./.flow-toolchain/flow run examples/full_car_demo.flow
      - name: Verify native Flow equation-first RK4 vehicle model
        run: ./.flow-toolchain/flow run examples/equation_vehicle.flow
      - name: Verify correlated linear dimensional stacks
        run: ./.flow-toolchain/flow run tests/linear_stackups.flow
      - name: Run dimensional stack demonstration
        run: ./.flow-toolchain/flow run examples/linear_stackups_demo.flow
      - name: Run vehicle demo
        run: ./.flow-toolchain/flow run examples/quarter_car_demo.flow
      - name: Run manufacturing demo
        run: ./.flow-toolchain/flow run examples/manufacturing_demo.flow

  browser-vehicle-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript and regression tests
        run: |
          node --check site/model.js
          node --check site/app.js
          node --test tests/vehicle_lab.test.mjs
